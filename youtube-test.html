<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.youtube.com https://*.bunny.net https://*.cloudflare.com https://cdn.tailwindcss.com https://unpkg.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Embed Test - EduStream</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800" data-page-id="test_youtube">

    <!-- Header -->
    <nav class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <a href="index.html"
                class="flex items-center justify-center w-8 h-8 rounded-full hover:bg-slate-100 text-slate-500 transition-colors">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div class="flex items-center gap-2 border-l border-slate-200 pl-4">
                <i data-lucide="youtube" class="text-red-600 w-5 h-5"></i>
                <span class="font-bold text-lg text-slate-900">YouTube Embed Check</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-xs font-semibold px-2 py-1 bg-red-50 text-red-600 rounded">TEST MODE</span>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Left Column -->
            <div class="lg:col-span-2 space-y-6">

                <!-- Player Container -->
                <div class="bg-black rounded-xl overflow-hidden shadow-2xl aspect-video relative group">
                    <!-- YouTube Embed -->
                    <iframe width="100%" height="100%"
                        src="https://www.youtube.com/embed/NybHckSEQBI?si=QbtYgr05I8woeizN" title="YouTube video player"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen
                        class="absolute top-0 left-0 w-full h-full"></iframe>
                </div>

                <!-- Info -->
                <div class="bg-white p-6 rounded-xl border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <i data-lucide="settings" class="w-5 h-5 text-slate-500"></i> 임베드 설정 확인
                    </h2>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div class="flex items-center gap-2">
                            <i data-lucide="check-circle-2" class="w-4 h-4 text-green-500"></i>
                            <span class="text-slate-600">rel=0 (관련영상 숨김)</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i data-lucide="check-circle-2" class="w-4 h-4 text-green-500"></i>
                            <span class="text-slate-600">modestbranding=1</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i data-lucide="check-circle-2" class="w-4 h-4 text-green-500"></i>
                            <span class="text-slate-600">playsinline=1 (iOS)</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i data-lucide="alert-circle" class="w-4 h-4 text-orange-500"></i>
                            <span class="text-slate-600">광고 제거 불가 (Standard)</span>
                        </div>
                    </div>
                </div>

                <!-- Notes -->
                <div class="bg-white p-6 rounded-xl border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-900 mb-2">테스트 기록 노트</h2>
                    <textarea id="performance-note"
                        class="w-full h-32 p-4 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-all resize-none text-sm placeholder-slate-400"
                        placeholder="예: 종료 화면에서 경쟁사 영상이 추천되는지 확인 필요..."></textarea>
                </div>

            </div>


            <!-- Right Column -->
            <div class="lg:col-span-1 space-y-6">

                <!-- Progress -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Progress</span>
                        <span id="progress-text" class="text-2xl font-bold text-red-600">0%</span>
                    </div>
                    <div class="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
                        <div id="progress-bar-fill" class="h-full bg-red-600 w-0 transition-all duration-500"></div>
                    </div>
                </div>

                <!-- Checklist -->
                <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
                    <div class="bg-slate-50 px-6 py-4 border-b border-slate-200">
                        <h3 class="font-bold text-slate-800">검증 항목</h3>
                    </div>
                    <div class="p-2">
                        <label
                            class="flex items-start gap-3 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                            <input type="checkbox" data-task="ad_check"
                                class="mt-1 w-5 h-5 text-red-600 rounded border-slate-300 focus:ring-red-500">
                            <div class="text-sm">
                                <span class="block font-medium text-slate-700">광고 노출 여부</span>
                                <span class="text-slate-400 text-xs">재생 전/중간/후 광고 발생 빈도</span>
                            </div>
                        </label>

                        <label
                            class="flex items-start gap-3 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                            <input type="checkbox" data-task="end_screen"
                                class="mt-1 w-5 h-5 text-red-600 rounded border-slate-300 focus:ring-red-500">
                            <div class="text-sm">
                                <span class="block font-medium text-slate-700">종료 화면 (End Screen)</span>
                                <span class="text-slate-400 text-xs">타 채널 영상 추천 최소화 여부</span>
                            </div>
                        </label>

                        <label
                            class="flex items-start gap-3 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                            <input type="checkbox" data-task="controls"
                                class="mt-1 w-5 h-5 text-red-600 rounded border-slate-300 focus:ring-red-500">
                            <div class="text-sm">
                                <span class="block font-medium text-slate-700">컨트롤러 UI 확인</span>
                                <span class="text-slate-400 text-xs">재생바, 설정 버튼 등 정상 작동</span>
                            </div>
                        </label>

                        <label
                            class="flex items-start gap-3 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                            <input type="checkbox" data-task="shortcuts"
                                class="mt-1 w-5 h-5 text-red-600 rounded border-slate-300 focus:ring-red-500">
                            <div class="text-sm">
                                <span class="block font-medium text-slate-700">키보드 단축키 (K, J, L)</span>
                                <span class="text-slate-400 text-xs">PC 환경에서의 학습 편의성 점검</span>
                            </div>
                        </label>

                        <label
                            class="flex items-start gap-3 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                            <input type="checkbox" data-task="privacy_mode"
                                class="mt-1 w-5 h-5 text-red-600 rounded border-slate-300 focus:ring-red-500">
                            <div class="text-sm">
                                <span class="block font-medium text-slate-700">개인정보 보호 모드</span>
                                <span class="text-slate-400 text-xs">youtube-nocookie 도메인 사용</span>
                            </div>
                        </label>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="asset/app.js"></script>
</body>

</html>
