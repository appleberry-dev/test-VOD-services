<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.youtube.com https://*.bunny.net https://*.cloudflare.com https://cdn.tailwindcss.com https://unpkg.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunny.net Stream Test - EduStream</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800" data-page-id="test_bunny">

    <!-- Header -->
    <nav class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <a href="index.html"
                class="flex items-center justify-center w-8 h-8 rounded-full hover:bg-slate-100 text-slate-500 transition-colors">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div class="flex items-center gap-2 border-l border-slate-200 pl-4">
                <i data-lucide="rabbit" class="text-orange-500 w-5 h-5"></i>
                <span class="font-bold text-lg text-slate-900">Bunny.net Check</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-xs font-semibold px-2 py-1 bg-blue-50 text-blue-600 rounded">TEST MODE</span>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Method 1: Left Column (Video Player) -->
            <div class="lg:col-span-2 space-y-6">

                <!-- Player Container -->
                <div class="bg-black rounded-xl overflow-hidden shadow-2xl aspect-video relative group">
                    <!-- Bunny.net Embed -->
                    <iframe
                        src="https://iframe.mediadelivery.net/embed/591423/bd99a95b-aa58-4bfc-b7de-aa9eecf9d6bd?autoplay=false&loop=false&muted=false&preload=true&responsive=true"
                        loading="lazy" class="absolute top-0 left-0 w-full h-full border-0"
                        allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;"
                        allowfullscreen="true">
                    </iframe>
                </div>

                <!-- Video Info -->
                <div class="bg-white p-6 rounded-xl border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <i data-lucide="info" class="w-5 h-5 text-blue-500"></i> 테스트 환경 정보
                    </h2>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div>
                            <span class="block text-slate-400 mb-1">Stream Protocol</span>
                            <span class="font-medium text-slate-700">HLS (Adaptive)</span>
                        </div>
                        <div>
                            <span class="block text-slate-400 mb-1">Latency Tier</span>
                            <span class="font-medium text-slate-700">Standard</span>
                        </div>
                        <div>
                            <span class="block text-slate-400 mb-1">Security</span>
                            <span class="font-medium text-slate-700">Token Auth (Optional)</span>
                        </div>
                        <div>
                            <span class="block text-slate-400 mb-1">Player Type</span>
                            <span class="font-medium text-slate-700">Bunny Built-in</span>
                        </div>
                    </div>
                </div>

                <!-- Performance Note Area -->
                <div class="bg-white p-6 rounded-xl border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-900 mb-2">테스트 기록 노트</h2>
                    <p class="text-sm text-slate-500 mb-4">로드 속도, 버퍼링 경험, 화질 저하 등 특이사항을 자유롭게 기록하세요. (자동 저장됨)</p>
                    <textarea id="performance-note"
                        class="w-full h-32 p-4 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all resize-none text-sm placeholder-slate-400"
                        placeholder="예: 4K 영상 로딩 시 초기 2초 딜레이 발생..."></textarea>
                </div>

            </div>


            <!-- Method 2: Right Column (Checklist) -->
            <div class="lg:col-span-1 space-y-6">

                <!-- Progress Card -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Progress</span>
                        <span id="progress-text" class="text-2xl font-bold text-blue-600">0%</span>
                    </div>
                    <div class="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
                        <div id="progress-bar-fill" class="h-full bg-blue-600 w-0 transition-all duration-500"></div>
                    </div>
                </div>

                <!-- Checklist Group -->
                <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
                    <div class="bg-slate-50 px-6 py-4 border-b border-slate-200">
                        <h3 class="font-bold text-slate-800">기능 점검 리스트</h3>
                    </div>
                    <div class="p-2">
                        <!-- Items -->
                        <label
                            class="flex items-start gap-3 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                            <input type="checkbox" data-task="load_speed"
                                class="mt-1 w-5 h-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                            <div class="text-sm">
                                <span class="block font-medium text-slate-700">초기 로딩 속도</span>
                                <span class="text-slate-400 text-xs">페이지 진입 후 1.5초 이내 재생 시작</span>
                            </div>
                        </label>

                        <label
                            class="flex items-start gap-3 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                            <input type="checkbox" data-task="quality_switch"
                                class="mt-1 w-5 h-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                            <div class="text-sm">
                                <span class="block font-medium text-slate-700">해상도 변경 (Auto/1080p)</span>
                                <span class="text-slate-400 text-xs">화질 변경 시 끊김없는 전환 확인</span>
                            </div>
                        </label>

                        <label
                            class="flex items-start gap-3 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                            <input type="checkbox" data-task="seek_performance"
                                class="mt-1 w-5 h-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                            <div class="text-sm">
                                <span class="block font-medium text-slate-700">탐색(Seek) 반응성</span>
                                <span class="text-slate-400 text-xs">랜덤 위치 클릭 시 즉시 재생 여부</span>
                            </div>
                        </label>

                        <label
                            class="flex items-start gap-3 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                            <input type="checkbox" data-task="playback_speed"
                                class="mt-1 w-5 h-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                            <div class="text-sm">
                                <span class="block font-medium text-slate-700">배속 재생 (1.25x ~ 2.0x)</span>
                                <span class="text-slate-400 text-xs">음성 피치 보정 및 싱크 정상 여부</span>
                            </div>
                        </label>

                        <label
                            class="flex items-start gap-3 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                            <input type="checkbox" data-task="fullscreen"
                                class="mt-1 w-5 h-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                            <div class="text-sm">
                                <span class="block font-medium text-slate-700">전체화면 모드</span>
                                <span class="text-slate-400 text-xs">UI 깨짐 없이 전환되는지 확인</span>
                            </div>
                        </label>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="asset/app.js"></script>
</body>

</html>
